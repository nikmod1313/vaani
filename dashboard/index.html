<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaaniLedger — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23253A6E'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='800' fill='white' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F7F6F3; --surface:#FFFFFF; --surface-2:#F1EFEA;
  --ink:#17191E; --ink-2:#43474F; --ink-3:#7A7E88;
  --rule:#DFDCD5; --rule-strong:#C5C1B8;
  --indigo:#253A6E; --indigo-soft:#E7EBF4;
  --good:#2C6149; --good-soft:#E1EDE7;
  --warn:#8A5D0B; --warn-soft:#F5EBD7;
  --cut:#9B3A2C; --cut-soft:#F5E4E0;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121317; --surface:#191B20; --surface-2:#21242B;
    --ink:#EDEDEA; --ink-2:#B4B7BF; --ink-3:#7E828C;
    --rule:#2C2F37; --rule-strong:#3E424C;
    --indigo:#93A9DE; --indigo-soft:#1C2337;
    --good:#7FC3A2; --good-soft:#16251E;
    --warn:#D9AC5A; --warn-soft:#292013;
    --cut:#DE8F80; --cut-soft:#2B1A16;
  }
}
:root[data-theme="dark"]{
  --ground:#121317; --surface:#191B20; --surface-2:#21242B;
  --ink:#EDEDEA; --ink-2:#B4B7BF; --ink-3:#7E828C;
  --rule:#2C2F37; --rule-strong:#3E424C;
  --indigo:#93A9DE; --indigo-soft:#1C2337;
  --good:#7FC3A2; --good-soft:#16251E;
  --warn:#D9AC5A; --warn-soft:#292013;
  --cut:#DE8F80; --cut-soft:#2B1A16;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 80px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  padding:36px 0 20px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;
  place-items:center;font-family:var(--f-display);font-size:18px;font-weight:800;flex:none}
:root[data-theme="dark"] .mark,:root:not([data-theme="light"]) .mark{color:var(--ground)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .mark{color:#fff}}
h1{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h1 small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule-strong);
  background:var(--surface);padding:7px 13px;color:var(--ink-2)}
.btn:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--ground);font-weight:600}
select.btn{padding-right:8px}

/* status */
.status{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.06em;color:var(--ink-3);align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:5px}
.dot.off{background:var(--rule-strong)}
.dot.err{background:var(--cut)}
.status span{display:inline-flex;align-items:center}
.status i{color:var(--rule-strong);font-style:normal}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:26px}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.035em;margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .c{font-family:var(--f-mono);font-size:11px;margin-top:3px;color:var(--ink-3)}
.kpi.w .v{color:var(--warn)} .kpi.d .v{color:var(--cut)} .kpi.g .v{color:var(--good)}
/* Five tiles in a two-column grid leave an orphan cell showing the grid's
   own background. Let the last one span instead. */
@media (max-width:560px){.kpi:last-child{grid-column:1/-1}}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
  gap:10px;flex-wrap:wrap;align-items:center}
.card-hd h2{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500}
.card-hd .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

/* chart */
.chart-wrap{padding:16px 16px 8px;overflow-x:auto}
svg.chart{display:block;width:100%;min-width:420px;height:200px}
.legend{display:flex;gap:16px;padding:0 16px 14px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}

/* table */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:340px}
th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;background:var(--surface-2)}
td{color:var(--ink-2)}
td b{color:var(--ink);font-weight:600;display:block}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
td.num.due{color:var(--warn)} td.num.clear{color:var(--good)}
.flag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--cut-soft);color:var(--cut);padding:1.5px 5px;display:inline-block;margin-top:3px}
.sub{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

/* narration */
.narr{padding:16px;display:flex;flex-direction:column;gap:12px}
.narr p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.narr .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);line-height:1.5}
.note.warn{color:var(--warn)}

/* states */
.msg{padding:40px 20px;text-align:center;color:var(--ink-3);font-family:var(--f-mono);font-size:13px;line-height:1.7}
.msg .btn{margin-top:14px}
.skel{background:var(--surface-2);border-radius:2px;display:inline-block;height:1em;width:4em;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark">V</span>
      <h1 id="shopName">VaaniLedger<small id="shopMeta">loading</small></h1>
    </div>
    <div class="tools">
      <select class="btn" id="lang" aria-label="Narration language">
        <option value="hi-IN">हिन्दी</option>
        <option value="en-IN">English</option>
        <option value="mr-IN">मराठी</option>
      </select>
      <button class="btn" id="csv">Export CSV</button>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn primary" id="seed">Load demo data</button>
    </div>
  </header>

  <div class="status" id="status"><span>connecting…</span></div>

  <div id="empty" class="msg hidden">
    <div>No shop data yet.</div>
    <button class="btn primary" id="seedEmpty">Load demo data</button>
  </div>

  <div id="main" class="hidden">
    <div class="kpis" id="kpis"></div>

    <div class="grid">
      <div class="card">
        <div class="card-hd">
          <h2>Last 14 days</h2>
          <span class="meta">Cash + UPI vs udhaar</span>
        </div>
        <div class="chart-wrap"><svg class="chart" id="chart" role="img" aria-label="Daily sales"></svg></div>
        <div class="legend">
          <span><i style="background:var(--indigo)"></i>Cash + UPI</span>
          <span><i style="background:var(--warn);opacity:.5"></i>Udhaar</span>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">
          <h2>Aaj ka hisaab</h2>
          <span class="meta" id="narrMeta"></span>
        </div>
        <div class="narr">
          <p id="narrText"><span class="skel"></span></p>
          <div class="row">
            <button class="btn primary" id="play" disabled>▶ Suno</button>
            <audio id="audio" class="hidden"></audio>
          </div>
          <div class="note" id="narrNote"></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-hd">
        <h2>Udhaar khata</h2>
        <span class="meta" id="custMeta"></span>
      </div>
      <div class="tscroll">
        <table>
          <thead><tr><th>Grahak</th><th style="text-align:right">Baaki</th></tr></thead>
          <tbody id="customers"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Same-origin when served by FastAPI; override with ?api= for a split deploy.
  var API = new URLSearchParams(location.search).get("api") || "";
  var SHOP = new URLSearchParams(location.search).get("shop") || "sharma-kirana";

  var $ = function (id) { return document.getElementById(id); };
  var state = { summary: null, health: null };

  function rupees(n) {
    return "₹" + Math.round(n || 0).toLocaleString("en-IN");
  }

  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // ---------------------------------------------------------------- status
  function renderStatus() {
    var h = state.health;
    if (!h) {
      $("status").innerHTML = '<span><span class="dot err"></span>API unreachable</span>';
      return;
    }
    // Say plainly which stages are degraded, so nobody demos rules-only
    // numbers believing the model ran.
    var stage2On = h.stage2 && h.stage2.indexOf("unavailable") === -1;
    var ttsOn = h.tts && h.tts.indexOf("unavailable") === -1;
    $("status").innerHTML =
      '<span><span class="dot"></span>API v' + h.version + "</span><i>/</i>" +
      '<span><span class="dot ' + (stage2On ? "" : "off") + '"></span>' +
      "extraction: " + (stage2On ? "rules + " + h.stage2 : "rules only") + "</span><i>/</i>" +
      '<span><span class="dot ' + (ttsOn ? "" : "off") + '"></span>' +
      "voice: " + (ttsOn ? "Bulbul v3" : "on-device fallback") + "</span><i>/</i>" +
      "<span>" + h.corrections + " corrections</span>";
  }

  // ------------------------------------------------------------------ kpis
  function renderKpis(s) {
    var overdue = (s.overdue || []).length;
    var autoRate = s.entry_count ? Math.round((s.auto_filled / s.entry_count) * 100) : 0;
    var cells = [
      { l: "Aaj ki sale", v: rupees(s.today_sale), c: s.entry_count + " entries", k: "" },
      { l: "Cash in", v: rupees(s.cash_in), c: s.today_sale ? Math.round(s.cash_in / s.today_sale * 100) + "% of sale" : "—", k: "g" },
      { l: "Udhaar aaj", v: rupees(s.udhaar_today), c: "on credit", k: "w" },
      { l: "Kul baaki", v: rupees(s.total_outstanding), c: overdue + " overdue > 30d", k: overdue ? "d" : "" },
      { l: "Auto-filled", v: autoRate + "%", c: s.auto_filled + " of " + s.entry_count, k: "" }
    ];
    $("kpis").innerHTML = cells.map(function (c) {
      return '<div class="kpi ' + c.k + '"><div class="l">' + c.l + "</div>" +
             '<div class="v">' + c.v + '</div><div class="c">' + c.c + "</div></div>";
    }).join("");
  }

  // ----------------------------------------------------------------- chart
  function renderChart(series) {
    var W = 640, H = 200, padB = 22, padT = 8;
    var max = Math.max.apply(null, series.map(function (d) { return d.cash + d.udhaar; }).concat([1]));
    var bw = W / series.length;
    var barW = Math.max(6, bw * 0.6);
    var plot = H - padB - padT;
    var parts = [];

    // Faint gridlines give the eye something to measure against.
    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      var y = padT + plot - plot * f;
      parts.push('<line x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) +
                 '" stroke="var(--rule)" stroke-width="1"/>');
    });

    series.forEach(function (d, i) {
      var x = i * bw + (bw - barW) / 2;
      var hc = (d.cash / max) * plot;
      var hu = (d.udhaar / max) * plot;
      var yc = padT + plot - hc;
      var yu = yc - hu;
      var last = i === series.length - 1;

      if (hu > 0) {
        parts.push('<rect x="' + x.toFixed(1) + '" y="' + yu.toFixed(1) + '" width="' + barW.toFixed(1) +
                   '" height="' + hu.toFixed(1) + '" fill="var(--warn)" opacity="0.5"/>');
      }
      if (hc > 0) {
        parts.push('<rect x="' + x.toFixed(1) + '" y="' + yc.toFixed(1) + '" width="' + barW.toFixed(1) +
                   '" height="' + hc.toFixed(1) + '" fill="var(--indigo)"/>');
      }
      parts.push('<title>' + d.date + " — cash " + rupees(d.cash) + ", udhaar " + rupees(d.udhaar) + "</title>");
      parts.push('<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (H - 7) +
                 '" text-anchor="middle" font-family="var(--f-mono)" font-size="9" ' +
                 'fill="' + (last ? "var(--indigo)" : "var(--ink-3)") + '">' +
                 d.date.slice(8) + "</text>");
    });

    var svg = $("chart");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.innerHTML = parts.join("");
  }

  // ------------------------------------------------------------- customers
  function renderCustomers(list) {
    var owing = list.filter(function (c) { return c.outstanding > 0; });
    $("custMeta").textContent = list.length + " grahak · " + owing.length + " owing";

    $("customers").innerHTML = list.map(function (c) {
      var overdue = c.days_overdue > 30;
      var when = c.last_activity ? c.last_activity.slice(0, 10) : "—";
      return "<tr><td><b>" + c.name + "</b>" +
             '<span class="sub">' + when + "</span>" +
             (overdue ? '<span class="flag">' + c.days_overdue + " din</span>" : "") +
             '</td><td class="num ' + (c.outstanding > 0 ? "due" : "clear") + '">' +
             rupees(c.outstanding) + "</td></tr>";
    }).join("");
  }

  // ------------------------------------------------------------- narration
  function loadNarration() {
    var lang = $("lang").value;
    $("narrText").innerHTML = '<span class="skel"></span>';
    $("play").disabled = true;
    $("narrNote").textContent = "";

    return api("/summary/narrate?shop_id=" + encodeURIComponent(SHOP) + "&lang=" + lang)
      .then(function (n) {
        $("narrText").textContent = n.text;
        $("narrMeta").textContent = n.characters + " chars";

        if (n.audio_url) {
          $("audio").src = API + n.audio_url;
          $("play").disabled = false;
          $("narrNote").className = "note";
          $("narrNote").textContent = n.cache_hit
            ? "Cached audio — no synthesis needed."
            : "Synthesised by Bulbul v3.";
        } else {
          // No key: the text is still the useful part, and the phone can
          // speak it with Android's built-in TTS.
          $("play").disabled = !("speechSynthesis" in window);
          $("narrNote").className = "note warn";
          $("narrNote").textContent =
            "SARVAM_API_KEY not set — falling back to this browser's speech engine. " +
            "Pronunciation will be worse than Bulbul.";
        }
      })
      .catch(function (e) {
        $("narrText").textContent = "Could not load summary.";
        $("narrNote").textContent = String(e.message || e);
      });
  }

  $("play").addEventListener("click", function () {
    var audio = $("audio");
    if (audio.src) { audio.play(); return; }
    if ("speechSynthesis" in window) {
      var u = new SpeechSynthesisUtterance($("narrText").textContent);
      u.lang = $("lang").value;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
  });

  $("lang").addEventListener("change", loadNarration);

  // -------------------------------------------------------------- csv
  $("csv").addEventListener("click", function () {
    if (!state.summary) return;
    var rows = [["date", "cash", "udhaar"]].concat(
      state.summary.series.map(function (d) { return [d.date, d.cash, d.udhaar]; })
    ).concat([[], ["customer", "outstanding", "days_overdue"]]).concat(
      state.summary.customers.map(function (c) { return [c.name, c.outstanding, c.days_overdue]; })
    );
    var csv = rows.map(function (r) { return r.join(","); }).join("\n");
    var url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = SHOP + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  // -------------------------------------------------------------- load
  function seed() {
    var btns = [$("seed"), $("seedEmpty")];
    btns.forEach(function (b) { if (b) { b.disabled = true; b.textContent = "Loading…"; } });
    return api("/shops/" + encodeURIComponent(SHOP) + "/seed?days=90", { method: "POST" })
      .then(load)
      .finally(function () {
        btns.forEach(function (b) { if (b) { b.disabled = false; b.textContent = "Load demo data"; } });
      });
  }

  $("seed").addEventListener("click", seed);
  $("seedEmpty").addEventListener("click", seed);
  $("refresh").addEventListener("click", function () { load(); });

  function load() {
    return api("/health")
      .then(function (h) { state.health = h; renderStatus(); })
      .catch(function () { state.health = null; renderStatus(); })
      .then(function () {
        return api("/shops/" + encodeURIComponent(SHOP) + "/summary");
      })
      .then(function (s) {
        state.summary = s;
        $("empty").classList.add("hidden");
        $("main").classList.remove("hidden");
        $("shopName").childNodes[0].nodeValue = (s.shop && s.shop.name) || SHOP;
        $("shopMeta").textContent = new Date().toDateString().toUpperCase();
        renderKpis(s);
        renderChart(s.series);
        renderCustomers(s.customers);
        return loadNarration();
      })
      .catch(function () {
        // A 404 here means the shop has no data yet, which is the normal
        // first-run state, not an error worth alarming anyone about.
        $("main").classList.add("hidden");
        $("empty").classList.remove("hidden");
      });
  }

  load();
})();
</script>
</body>
</html>
