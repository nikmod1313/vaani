<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaani — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231B2A5C'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23D9B05E' stroke-width='1.2'/%3E%3Ctext x='16' y='21.5' font-family='serif' font-size='15' fill='%23F0DCA8' text-anchor='middle'%3E%E0%A4%B5%E0%A4%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;600;700&display=swap">
<style>
/*
  The same book the app is: indigo and gold on parchment, a manuscript
  serif for headings and figures, Mukta for everything read at length.
  Every colour is a token below, and the chart draws from the same tokens,
  so light and dark stay one design.
*/
:root{
  --ground:#F3EAD3; --surface:#FBF6EA; --surface-2:#ECE1C6;
  --ink:#2A1F17; --ink-2:#4A3D30; --ink-3:#6A5A48;
  --rule:#DCCBA4; --rule-strong:#C2AE82;
  --indigo:#1B2A5C; --indigo-soft:#E4E3EA; --night:#111C42;
  --gold:#A87A2A; --gold-bright:#D9B05E; --gold-pale:#F0DCA8;
  --good:#2C633F; --good-soft:#DFE8D2;
  --warn:#9A5A12; --warn-soft:#F4E0B8;
  --cut:#8E2A2A; --cut-soft:#F2DCD6;
  --paisley-strength:.34;
  --f-display:"Tiro Devanagari Hindi",Georgia,"Times New Roman",serif;
  --f-body:"Mukta",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"Mukta",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1633; --surface:#16204A; --surface-2:#1E2A58;
    --ink:#F3EAD3; --ink-2:#D8CCAF; --ink-3:#A89A7D;
    --rule:#2C3A6E; --rule-strong:#3E4D85;
    --indigo:#D9B05E; --indigo-soft:#243064; --night:#0B1230;
    --gold:#D9B05E;
    --good:#8FC9A0; --good-soft:#18302A; --warn:#E0B060; --warn-soft:#33290F;
    --cut:#E08A7A; --cut-soft:#3A1E1C; --paisley-strength:.10;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1633; --surface:#16204A; --surface-2:#1E2A58;
  --ink:#F3EAD3; --ink-2:#D8CCAF; --ink-3:#A89A7D;
  --rule:#2C3A6E; --rule-strong:#3E4D85;
  --indigo:#D9B05E; --indigo-soft:#243064; --night:#0B1230;
  --gold:#D9B05E;
  --good:#8FC9A0; --good-soft:#18302A; --warn:#E0B060; --warn-soft:#33290F;
  --cut:#E08A7A; --cut-soft:#3A1E1C; --paisley-strength:.10;
}

*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;background:var(--ground) url(/assets/tex_parchment.webp) center/cover fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:none}}
:root[data-theme="dark"] body{background-image:none}
/* The paisley endpaper, pressed faintly into the page. */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:url(/assets/tex_paisley.webp) center top/cover;opacity:var(--paisley-strength)}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 24px 64px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header: the palace banner */
header{position:relative;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;
  margin-top:24px;padding:30px 30px 26px;border-radius:10px;color:#F6EEDA;
  background:linear-gradient(100deg,rgba(17,28,66,.97) 0%,rgba(17,28,66,.9) 42%,rgba(17,28,66,.45) 100%),
    url(/assets/art_palace.webp) right 88%/cover,#111C42;
  border:1px solid #D9B05E;box-shadow:inset 0 0 0 5px rgba(17,28,66,.0),inset 0 0 0 6px rgba(240,220,168,.35),
    0 10px 30px -18px rgba(17,28,66,.6)}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 32%,#2A3D7A,#111C42);color:#F0DCA8;
  font-family:var(--f-display);font-size:24px;padding-top:4px;box-shadow:0 0 0 2px rgba(240,220,168,.7),inset 0 0 0 5px #111C42,inset 0 0 0 6.5px #D9B05E}
.eyebrow{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#D9B05E}
h1{font-family:var(--f-display);font-size:34px;line-height:1.1;margin-top:2px}
h1 small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(246,238,218,.72);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--f-body);font-size:14px;font-weight:600;border:1px solid var(--rule-strong);border-radius:20px;
  background:var(--surface);padding:6px 16px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--night);border-color:var(--night);color:#F6EEDA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);border-color:var(--gold);color:#111C42}}
:root[data-theme="dark"] .btn.primary{background:var(--gold);border-color:var(--gold);color:#111C42}
header .btn{background:rgba(246,238,218,.08);border-color:rgba(240,220,168,.45);color:#F6EEDA}
header .btn:hover:not(:disabled){border-color:#D9B05E;color:#F0DCA8}
header .btn.primary{background:#D9B05E;border-color:#D9B05E;color:#111C42}
header select.btn option{color:#2A1F17}
select.btn{padding-right:10px}

/* a manuscript divider: line, lozenge, line */
.rule{display:flex;align-items:center;gap:10px;margin:22px auto 0;max-width:340px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.rule::after{background:linear-gradient(90deg,currentColor,transparent)}
.rule i{width:8px;height:8px;border:1px solid currentColor;transform:rotate(45deg)}

/* status */
.status{display:flex;flex-wrap:wrap;gap:10px;margin:14px 2px 0;font-size:13px;color:var(--ink-3);align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
.dot.off{background:var(--rule-strong)}
.dot.err{background:var(--cut)}
.status span{display:inline-flex;align-items:center}
.status i{color:var(--rule-strong);font-style:normal}

/* card: fresh paper with a gold double rule, as on a ledger page */
.card,.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 4.8px rgba(168,122,42,.32),0 1.5px 0 rgba(90,60,20,.08)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:22px}
.kpi{padding:16px 20px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:32px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .c{font-size:12.5px;margin-top:2px;color:var(--ink-3)}
.kpi.w .v{color:var(--warn)} .kpi.d .v{color:var(--cut)} .kpi.g .v{color:var(--good)}
@media (max-width:560px){.kpi:last-child{grid-column:1/-1}}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;min-width:0}
.card-hd{padding:16px 20px 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;
  border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(168,122,42,.55),transparent) 1}
.card-hd h2{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.card-hd .meta{font-size:12.5px;color:var(--ink-3)}

/* chart */
.chart-wrap{padding:16px 18px 8px;overflow-x:auto}
svg.chart{display:block;width:100%;min-width:420px;height:200px;font-family:var(--f-body)}
.legend{display:flex;gap:18px;padding:0 20px 16px;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}

/* table */
.tscroll{overflow-x:auto;padding:0 6px 6px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:340px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
td{color:var(--ink-2)}
td b{color:var(--ink);font-weight:600;display:block}
td.num{text-align:right;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
td.num.due{color:var(--warn)} td.num.clear{color:var(--good)}
.flag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:10px;
  background:var(--cut-soft);color:var(--cut);padding:1px 8px;display:inline-block;margin-top:4px}
.sub{font-size:12.5px;color:var(--ink-3)}

/* narration */
.narr{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.narr p{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.65;color:var(--ink-2)}
.narr .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.note.warn{color:var(--warn)}

/* states */
.msg{padding:36px 20px 44px;text-align:center;color:var(--ink-3);font-family:var(--f-display);font-size:18px;line-height:1.7}
.msg::before{content:"";display:block;width:150px;height:170px;margin:0 auto 14px;
  background:url(/assets/art_elephant.webp) center/contain no-repeat}
.msg .btn{margin-top:14px;font-family:var(--f-body)}
.skel{background:var(--surface-2);border-radius:2px;display:inline-block;height:1em;width:4em;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hidden{display:none!important}

/* the colophon */
footer{text-align:center;margin-top:34px;color:var(--ink-3)}
footer .sun{width:46px;height:46px;margin:0 auto;background:url(/assets/art_sun.webp) center/contain no-repeat}
footer .name{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-top:6px}
footer .tag{font-family:var(--f-display);font-style:italic;font-size:15px}
@media (max-width:560px){
  .wrap{padding:0 16px 48px}
  header{padding:22px 20px 20px}
  h1{font-size:28px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">वा</span>
      <div>
        <div class="eyebrow">वाणी · Vaani</div>
        <h1 id="shopName">Vaani<small id="shopMeta">loading</small></h1>
      </div>
    </div>
    <div class="tools">
      <select class="btn" id="lang" aria-label="Narration language">
        <option value="hi-IN">हिन्दी</option>
        <option value="en-IN">English</option>
        <option value="mr-IN">मराठी</option>
      </select>
      <button class="btn" id="csv">Export CSV</button>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn primary" id="seed">Load demo data</button>
    </div>
  </header>

  <div class="status" id="status"><span>connecting…</span></div>
  <div class="rule" aria-hidden="true"><i></i></div>

  <div id="empty" class="msg hidden">
    <div>No shop data yet.</div>
    <button class="btn primary" id="seedEmpty">Load demo data</button>
  </div>

  <div id="main" class="hidden">
    <div class="kpis" id="kpis"></div>

    <div class="grid">
      <div class="card">
        <div class="card-hd">
          <h2>Last 14 days</h2>
          <span class="meta">Cash + UPI vs udhaar</span>
        </div>
        <div class="chart-wrap"><svg class="chart" id="chart" role="img" aria-label="Daily sales"></svg></div>
        <div class="legend">
          <span><i style="background:var(--indigo)"></i>Cash + UPI</span>
          <span><i style="background:var(--warn);opacity:.5"></i>Udhaar</span>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">
          <h2>Aaj ka hisaab</h2>
          <span class="meta" id="narrMeta"></span>
        </div>
        <div class="narr">
          <p id="narrText"><span class="skel"></span></p>
          <div class="row">
            <button class="btn primary" id="play" disabled>▶ Suno</button>
            <audio id="audio" class="hidden"></audio>
          </div>
          <div class="note" id="narrNote"></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-hd">
        <h2>Udhaar khata</h2>
        <span class="meta" id="custMeta"></span>
      </div>
      <div class="tscroll">
        <table>
          <thead><tr><th>Grahak</th><th style="text-align:right">Baaki</th></tr></thead>
          <tbody id="customers"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>
    <div class="sun" aria-hidden="true"></div>
    <div class="name">वाणी</div>
    <div class="tag">Aapka khata, aapki awaaz mein</div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // Same-origin when served by FastAPI; override with ?api= for a split deploy.
  var API = new URLSearchParams(location.search).get("api") || "";
  var SHOP = new URLSearchParams(location.search).get("shop") || "sharma-kirana";

  var $ = function (id) { return document.getElementById(id); };
  var state = { summary: null, health: null };

  function rupees(n) {
    return "₹" + Math.round(n || 0).toLocaleString("en-IN");
  }

  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // ---------------------------------------------------------------- status
  function renderStatus() {
    var h = state.health;
    if (!h) {
      $("status").innerHTML = '<span><span class="dot err"></span>API unreachable</span>';
      return;
    }
    // Say plainly which stages are degraded, so nobody demos rules-only
    // numbers believing the model ran.
    var stage2On = h.stage2 && h.stage2.indexOf("unavailable") === -1;
    var ttsOn = h.tts && h.tts.indexOf("unavailable") === -1;
    $("status").innerHTML =
      '<span><span class="dot"></span>API v' + h.version + "</span><i>/</i>" +
      '<span><span class="dot ' + (stage2On ? "" : "off") + '"></span>' +
      "extraction: " + (stage2On ? "rules + " + h.stage2 : "rules only") + "</span><i>/</i>" +
      '<span><span class="dot ' + (ttsOn ? "" : "off") + '"></span>' +
      "voice: " + (ttsOn ? "Bulbul v3" : "on-device fallback") + "</span><i>/</i>" +
      "<span>" + h.corrections + " corrections</span>";
  }

  // ------------------------------------------------------------------ kpis
  function renderKpis(s) {
    var overdue = (s.overdue || []).length;
    var autoRate = s.entry_count ? Math.round((s.auto_filled / s.entry_count) * 100) : 0;
    var cells = [
      { l: "Aaj ki sale", v: rupees(s.today_sale), c: s.entry_count + " entries", k: "" },
      { l: "Cash in", v: rupees(s.cash_in), c: s.today_sale ? Math.round(s.cash_in / s.today_sale * 100) + "% of sale" : "—", k: "g" },
      { l: "Udhaar aaj", v: rupees(s.udhaar_today), c: "on credit", k: "w" },
      { l: "Kul baaki", v: rupees(s.total_outstanding), c: overdue + " overdue > 30d", k: overdue ? "d" : "" },
      { l: "Auto-filled", v: autoRate + "%", c: s.auto_filled + " of " + s.entry_count, k: "" }
    ];
    $("kpis").innerHTML = cells.map(function (c) {
      return '<div class="kpi ' + c.k + '"><div class="l">' + c.l + "</div>" +
             '<div class="v">' + c.v + '</div><div class="c">' + c.c + "</div></div>";
    }).join("");
  }

  // ----------------------------------------------------------------- chart
  function renderChart(series) {
    var W = 640, H = 200, padB = 22, padT = 8;
    var max = Math.max.apply(null, series.map(function (d) { return d.cash + d.udhaar; }).concat([1]));
    var bw = W / series.length;
    var barW = Math.max(6, bw * 0.6);
    var plot = H - padB - padT;
    var parts = [];

    // Faint gridlines give the eye something to measure against.
    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      var y = padT + plot - plot * f;
      parts.push('<line x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) +
                 '" stroke="var(--rule)" stroke-width="1"/>');
    });

    series.forEach(function (d, i) {
      var x = i * bw + (bw - barW) / 2;
      var hc = (d.cash / max) * plot;
      var hu = (d.udhaar / max) * plot;
      var yc = padT + plot - hc;
      var yu = yc - hu;
      var last = i === series.length - 1;

      if (hu > 0) {
        parts.push('<rect x="' + x.toFixed(1) + '" y="' + yu.toFixed(1) + '" width="' + barW.toFixed(1) +
                   '" height="' + hu.toFixed(1) + '" fill="var(--warn)" opacity="0.5"/>');
      }
      if (hc > 0) {
        parts.push('<rect x="' + x.toFixed(1) + '" y="' + yc.toFixed(1) + '" width="' + barW.toFixed(1) +
                   '" height="' + hc.toFixed(1) + '" fill="var(--indigo)"/>');
      }
      parts.push('<title>' + d.date + " — cash " + rupees(d.cash) + ", udhaar " + rupees(d.udhaar) + "</title>");
      parts.push('<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (H - 7) +
                 '" text-anchor="middle" font-family="var(--f-mono)" font-size="9" ' +
                 'fill="' + (last ? "var(--indigo)" : "var(--ink-3)") + '">' +
                 d.date.slice(8) + "</text>");
    });

    var svg = $("chart");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.innerHTML = parts.join("");
  }

  // ------------------------------------------------------------- customers
  function renderCustomers(list) {
    var owing = list.filter(function (c) { return c.outstanding > 0; });
    $("custMeta").textContent = list.length + " grahak · " + owing.length + " owing";

    $("customers").innerHTML = list.map(function (c) {
      var overdue = c.days_overdue > 30;
      var when = c.last_activity ? c.last_activity.slice(0, 10) : "—";
      return "<tr><td><b>" + c.name + "</b>" +
             '<span class="sub">' + when + "</span>" +
             (overdue ? '<span class="flag">' + c.days_overdue + " din</span>" : "") +
             '</td><td class="num ' + (c.outstanding > 0 ? "due" : "clear") + '">' +
             rupees(c.outstanding) + "</td></tr>";
    }).join("");
  }

  // ------------------------------------------------------------- narration
  function loadNarration() {
    var lang = $("lang").value;
    $("narrText").innerHTML = '<span class="skel"></span>';
    $("play").disabled = true;
    $("narrNote").textContent = "";

    return api("/summary/narrate?shop_id=" + encodeURIComponent(SHOP) + "&lang=" + lang)
      .then(function (n) {
        $("narrText").textContent = n.text;
        $("narrMeta").textContent = n.characters + " chars";

        if (n.audio_url) {
          $("audio").src = API + n.audio_url;
          $("play").disabled = false;
          $("narrNote").className = "note";
          $("narrNote").textContent = n.cache_hit
            ? "Cached audio — no synthesis needed."
            : "Synthesised by Bulbul v3.";
        } else {
          // No key: the text is still the useful part, and the phone can
          // speak it with Android's built-in TTS.
          $("play").disabled = !("speechSynthesis" in window);
          $("narrNote").className = "note warn";
          $("narrNote").textContent =
            "SARVAM_API_KEY not set — falling back to this browser's speech engine. " +
            "Pronunciation will be worse than Bulbul.";
        }
      })
      .catch(function (e) {
        $("narrText").textContent = "Could not load summary.";
        $("narrNote").textContent = String(e.message || e);
      });
  }

  $("play").addEventListener("click", function () {
    var audio = $("audio");
    if (audio.src) { audio.play(); return; }
    if ("speechSynthesis" in window) {
      var u = new SpeechSynthesisUtterance($("narrText").textContent);
      u.lang = $("lang").value;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
  });

  $("lang").addEventListener("change", loadNarration);

  // -------------------------------------------------------------- csv
  $("csv").addEventListener("click", function () {
    if (!state.summary) return;
    var rows = [["date", "cash", "udhaar"]].concat(
      state.summary.series.map(function (d) { return [d.date, d.cash, d.udhaar]; })
    ).concat([[], ["customer", "outstanding", "days_overdue"]]).concat(
      state.summary.customers.map(function (c) { return [c.name, c.outstanding, c.days_overdue]; })
    );
    var csv = rows.map(function (r) { return r.join(","); }).join("\n");
    var url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = SHOP + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  // -------------------------------------------------------------- load
  function seed() {
    var btns = [$("seed"), $("seedEmpty")];
    btns.forEach(function (b) { if (b) { b.disabled = true; b.textContent = "Loading…"; } });
    return api("/shops/" + encodeURIComponent(SHOP) + "/seed?days=90", { method: "POST" })
      .then(load)
      .finally(function () {
        btns.forEach(function (b) { if (b) { b.disabled = false; b.textContent = "Load demo data"; } });
      });
  }

  $("seed").addEventListener("click", seed);
  $("seedEmpty").addEventListener("click", seed);
  $("refresh").addEventListener("click", function () { load(); });

  function load() {
    return api("/health")
      .then(function (h) { state.health = h; renderStatus(); })
      .catch(function () { state.health = null; renderStatus(); })
      .then(function () {
        return api("/shops/" + encodeURIComponent(SHOP) + "/summary");
      })
      .then(function (s) {
        state.summary = s;
        $("empty").classList.add("hidden");
        $("main").classList.remove("hidden");
        $("shopName").childNodes[0].nodeValue = (s.shop && s.shop.name) || SHOP;
        $("shopMeta").textContent = new Date().toDateString().toUpperCase();
        renderKpis(s);
        renderChart(s.series);
        renderCustomers(s.customers);
        return loadNarration();
      })
      .catch(function () {
        // A 404 here means the shop has no data yet, which is the normal
        // first-run state, not an error worth alarming anyone about.
        $("main").classList.add("hidden");
        $("empty").classList.remove("hidden");
      });
  }

  load();
})();
</script>
</body>
</html>
